name: Build and Release ESP32 Firmware

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      enable_coredump:
        description: 'Diagnostic build: panic core dump capture + download endpoint. Only published to pre-releases (fails for a stable release); otherwise artifacts only. The dump can leak WiFi/pool credentials to anyone on the LAN unless OTP is enabled on the device.'
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
    strategy:
      matrix:
        include:
          - board: NERDQAXEPLUS
            upload_www: true
            label: NerdQAxe+
          - board: NERDOCTAXEPLUS
            upload_www: false
            label: NerdOCTAXE+
          - board: NERDQAXEPLUS2
            upload_www: false
            label: NerdQAxe++
          - board: NERDAXE
            upload_www: false
            label: NerdAxe
          - board: NERDOCTAXEGAMMA
            upload_www: false
            label: NerdOCTAXE-Gamma
          - board: NERDAXEGAMMA
            upload_www: false
            label: NerdAxeGamma
          - board: NERDAXEGAIA
            upload_www: false
            label: NerdAxeGaia
          - board: NERDHAXEGAMMA
            upload_www: false
            label: NerdHaxe-Gamma
          - board: NERDEKO
            upload_www: false
            label: NerdEKO
          - board: NERDQX
            upload_www: false
            label: NerdQX
          - board: Q1370
            upload_www: false
            label: Q1370
          - board: Q1373
            upload_www: false
            label: Q1373

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Get Version Tag
      id: version_tag
      run: |
        git fetch --tags  # Ensure all tags are fetched
        version=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
        echo "VERSION_TAG=${version}" >> $GITHUB_ENV
        echo "${version}" > version.txt
        echo "VERSION_TAG=${version}"

    - name: Install GitHub CLI
      run: |
        sudo apt-get update -y
        sudo apt-get install -y gh

    - name: Check if release exists
      id: check_release
      run: |
        if gh release view "${{ env.VERSION_TAG }}" >/dev/null 2>&1; then
          RELEASE_EXISTS=true
          RELEASE_PRERELEASE=$(gh release view "${{ env.VERSION_TAG }}" --json isPrerelease --jq .isPrerelease)
        else
          RELEASE_EXISTS=false
          RELEASE_PRERELEASE=false
        fi
        echo "RELEASE_EXISTS=$RELEASE_EXISTS" >> $GITHUB_ENV

        # Decide whether this build may be published (GitHub release + R2 webflasher).
        # Diagnostic (core dump) builds are only published to pre-releases, so a
        # stable release can never ship the dump download endpoint.
        if [ "${{ inputs.enable_coredump }}" != "true" ]; then
          echo "PUBLISH=true" >> $GITHUB_ENV
        elif [ "$RELEASE_PRERELEASE" == "true" ]; then
          echo "Diagnostic build for pre-release '${{ env.VERSION_TAG }}' — will be published"
          echo "PUBLISH=true" >> $GITHUB_ENV
        elif [ "$RELEASE_EXISTS" == "true" ]; then
          echo "::error::'${{ env.VERSION_TAG }}' is a stable release — core dump diagnostic builds may only be published to pre-releases"
          exit 1
        else
          echo "Diagnostic build without a release — artifacts only"
          echo "PUBLISH=false" >> $GITHUB_ENV
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Insert Version
      run: |
        #!/bin/bash
        set -e
        COMMIT_HASH=$(git rev-parse --short HEAD)
        sed -e "s|__COMMIT__|${COMMIT_HASH}|g" -i ./main/http_server/axe-os/src/app/app.module.ts
        sed -e "s|__VERSION__|${VERSION_TAG}|g" -i ./main/http_server/axe-os/src/app/app.module.ts
        for l in de en es fr it pl ro da zh-CN; do
          mv "./main/http_server/axe-os/src/assets/i18n/${l}.json" "./main/http_server/axe-os/src/assets/i18n/${l}.${COMMIT_HASH}.json"
        done

    # Diagnostic builds layer sdkconfig.coredump on top of the defaults. The firmware
    # gates the download endpoint on CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH, so this is
    # the single switch for capture + endpoint. An empty value means "use defaults".
    - name: Configure core dump build
      run: |
        if [ "${{ inputs.enable_coredump }}" == "true" ]; then
          echo "Diagnostic build: panic core dumps + download endpoint ENABLED"
          echo "IDF_SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.coredump" >> $GITHUB_ENV
          echo "ARTIFACT_SUFFIX=-coredump" >> $GITHUB_ENV
        else
          echo "IDF_SDKCONFIG_DEFAULTS=" >> $GITHUB_ENV
          echo "ARTIFACT_SUFFIX=" >> $GITHUB_ENV
        fi

    - name: Set Target
      run: |
        # Run the Docker container to set ESP32-S3 target
        docker run --rm --user root -e BOARD=${{ matrix.board }} -e SDKCONFIG_DEFAULTS="$IDF_SDKCONFIG_DEFAULTS" -v $PWD:/home/builder/project \
        shufps/esp-idf-builder:0.0.1 idf.py set-target esp32s3

    - name: Compile Binaries
      run: |
        # Run the Docker container to build the project
        docker run --rm --user root -e BOARD=${{ matrix.board }} -e SDKCONFIG_DEFAULTS="$IDF_SDKCONFIG_DEFAULTS" -v $PWD:/home/builder/project \
        shufps/esp-idf-builder:0.0.1 idf.py build

    - name: Verify core dump configuration
      run: |
        if [ "${{ inputs.enable_coredump }}" == "true" ]; then
          grep -q '^CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y' sdkconfig || { echo "::error::core dump requested but not enabled in sdkconfig"; exit 1; }
        else
          if grep -q '^CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y' sdkconfig; then echo "::error::core dump enabled in a normal build"; exit 1; fi
        fi

    - name: Merge Binaries
      run: |
        docker run --rm --user root -v $PWD:/home/builder/project \
        shufps/esp-idf-builder:0.0.1 esptool.py --chip esp32s3 merge_bin --flash_mode dio --flash_size 16MB --flash_freq 80m \
        0x0 build/bootloader/bootloader.bin \
        0x8000 build/partition_table/partition-table.bin \
        0x10000 build/esp-miner.bin \
        0x410000 build/www.bin \
        0xf10000 build/ota_data_initial.bin \
        -o esp-miner-factory-${{ matrix.label }}-${{ env.VERSION_TAG }}.bin

    - name: Rename Build Artifacts
      run: |
        sudo mv build/esp-miner.bin build/esp-miner-${{ matrix.label }}.bin
        sudo mv build/esp-miner.elf build/esp-miner-${{ matrix.label }}.elf

    - name: Upload factory binary
      if: env.RELEASE_EXISTS == 'false' || inputs.enable_coredump
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner-factory-${{ matrix.label }}-${{ env.VERSION_TAG }}${{ env.ARTIFACT_SUFFIX }}.bin
        path: esp-miner-factory-${{ matrix.label }}-${{ env.VERSION_TAG }}.bin
        retention-days: 7

    - name: Upload ELF for crash analysis
      if: inputs.enable_coredump
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner-${{ matrix.label }}${{ env.ARTIFACT_SUFFIX }}.elf
        path: build/esp-miner-${{ matrix.label }}.elf
        retention-days: 7

    - name: Upload BIN firmware
      if: env.RELEASE_EXISTS == 'false' || inputs.enable_coredump
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner-${{ matrix.label }}${{ env.ARTIFACT_SUFFIX }}.bin
        path: build/esp-miner-${{ matrix.label }}.bin
        retention-days: 7

    - name: Upload www.bin (only once)
      if: (env.RELEASE_EXISTS == 'false' || inputs.enable_coredump) && matrix.board == 'NERDQAXEPLUS'
      uses: actions/upload-artifact@v4
      with:
        name: www${{ env.ARTIFACT_SUFFIX }}.bin
        path: build/www.bin
        retention-days: 7


    - name: Create files list
      run: |
        echo "esp-miner-factory-${{ matrix.label }}-${{ env.VERSION_TAG }}.bin" > file_list.txt
        echo "build/esp-miner-${{ matrix.label }}.bin" >> file_list.txt
        echo "build/esp-miner-${{ matrix.label }}.elf" >> file_list.txt
        if [ "${{ matrix.upload_www }}" == "true" ]; then
          echo "build/www.bin" >> file_list.txt
        fi

    - name: Set files variable
      id: set_files_var
      run: |
        # Diagnostic builds attach the ELF so dumps can be decoded; normal releases keep it out.
        if [ "${{ inputs.enable_coredump }}" == "true" ]; then
          echo "files=$(cat file_list.txt | tr '\n' ',')" >> $GITHUB_ENV
        else
          echo "files=$(grep -v '\.elf$' file_list.txt | tr '\n' ',')" >> $GITHUB_ENV
        fi
        echo "r2_files=$(cat file_list.txt | tr '\n' ',')" >> $GITHUB_ENV

    # Skip release upload if no release exists
    - name: Skip release upload if not tagged
      if: env.RELEASE_EXISTS == 'false'
      run: echo "No GitHub release found for '${{ env.VERSION_TAG }}' — skipping release upload."

    # Diagnostic builds are only published to pre-releases (see "Check if release exists")
    - name: Skip publishing for diagnostic build
      if: env.PUBLISH != 'true'
      run: echo "Core dump diagnostic build without a pre-release — artifacts only, skipping GitHub release and R2 upload."

    - name: Upload to Existing Release
      if: env.RELEASE_EXISTS == 'true' && env.PUBLISH == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.files }}
        tag_name: ${{ env.VERSION_TAG }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install rclone
      if: env.RCLONE_CONF != '' && env.PUBLISH == 'true'
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash

    - name: Upload to Cloudflare R2 using rclone
      if: env.RCLONE_CONF != '' && env.PUBLISH == 'true'
      run: |
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

        TARGET_DIR="webflasher/${{ env.VERSION_TAG }}"

        echo "$r2_files" | tr ',' '\n' | grep -v '^$' | while read file; do
          rclone copyto "$file" "r2:${TARGET_DIR}/$(basename "$file")" --s3-acl public-read
        done
